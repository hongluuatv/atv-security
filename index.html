<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>ATV Security Portal</title><style>
:root{--nav:#101e32;--ink:#14263d;--muted:#586b80;--bg:#f3f6fa;--line:#dbe4ed;--blue:#1264bc;--teal:#087d78;--white:#fff}*{box-sizing:border-box}body{margin:0;font:15px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}button,a,input,textarea,select{outline-offset:4px}button{cursor:pointer}a{color:var(--blue)}.shell{display:grid;grid-template-columns:254px minmax(0,1fr);min-height:100vh}.side{background:var(--nav);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:12px;margin:0 8px 32px}.mark{width:42px;height:42px;display:grid;place-items:center;background:#1e527d;border-radius:12px;color:#a7e9ed}.brand strong{font-size:18px;letter-spacing:.2px;display:block}.brand small{font-size:11px;color:#a8bbd1;letter-spacing:1.7px}.navlabel{font-size:10px;letter-spacing:1.6px;color:#8fa8c3;margin:24px 10px 7px;font-weight:700}.nav button{width:100%;border:0;text-align:left;color:#c8d5e4;background:none;padding:10px 12px;border-radius:8px;margin:2px 0;display:flex;align-items:center;gap:12px}.nav button:hover,.nav button.active{background:#25405e;color:white}.nav button.active{box-shadow:inset 3px 0 #61d5d0}.icon{width:21px;height:21px;flex:none;vertical-align:middle}.sidefoot{font-size:12px;color:#a8bbd1;margin:30px 10px}.main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 36px;position:sticky;top:0;z-index:2}.top small{color:var(--muted)}.search{display:flex;align-items:center;gap:8px;background:#f4f7fa;border:1px solid var(--line);border-radius:9px;padding:8px 12px;max-width:360px;width:45%}.search input{width:100%;border:none;outline:none;background:transparent;color:var(--ink)}.content{max-width:1240px;margin:auto;padding:32px 36px 64px}.hero{background:linear-gradient(120deg,#102a49,#145a77);border-radius:20px;padding:35px 40px;color:#fff;position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:24px}.hero h1{font-size:clamp(28px,4vw,43px);line-height:1.17;margin:12px 0}.hero p{color:#d4e5f1;max-width:600px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:750;color:var(--teal)}.hero .eyebrow{color:#93e2e0}.heroart{width:180px;flex:none;color:#82d5d6}.btn{border:1px solid transparent;border-radius:9px;background:var(--blue);color:#fff;padding:10px 16px;font-weight:650;text-decoration:none;display:inline-flex;align-items:center;gap:8px}.btn:hover{filter:brightness(.94)}.btn.alt{background:#fff;color:var(--blue);border-color:var(--line)}.hero .btn{background:#fff;color:#144b6c}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:30px 0 14px}.sectionhead h2,h2{font-size:22px;margin:0;line-height:1.3}.sub{color:var(--muted);margin:5px 0 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}.card h3{margin:10px 0 5px;font-size:18px;line-height:1.4}.card p{color:var(--muted);margin:6px 0 14px}.tile{display:flex;flex-direction:column;align-items:start}.tile .btn{margin-top:auto}.tag{font-size:12px;color:var(--teal);font-weight:700}.symbol{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:#e8f2fc;color:var(--blue)}.symbol .icon{width:28px;height:28px}.symbol.green{background:#e1f5ef;color:#087d78}.symbol.purple{background:#eeecff;color:#6251a9}.progress{height:7px;background:#e4eaf0;border-radius:10px;overflow:hidden;width:100%;margin:12px 0}.progress span{display:block;background:var(--teal);height:100%}.small{font-size:12px;color:var(--muted)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.step{display:flex;gap:12px;align-items:start;background:white;border:1px solid var(--line);border-radius:12px;padding:16px}.num{background:#e4eef9;color:#175c9b;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;flex:none;font-weight:700}.step strong{display:block}.step small{color:var(--muted)}.notice{background:#fff8e8;border:1px solid #e9d7a9;border-radius:12px;padding:16px 20px;color:#72551b;margin:18px 0}.pagehead{margin-bottom:22px}.pagehead h1{font-size:32px;margin:5px 0;line-height:1.25}.lessonlayout{display:grid;grid-template-columns:250px 1fr;gap:18px}.lessonnav{align-self:start}.lessonnav button{display:block;text-align:left;width:100%;background:none;border:0;border-radius:8px;padding:10px;color:var(--ink)}.lessonnav button.current{background:#e8f2fc;color:var(--blue);font-weight:700}.lessonnav button:hover{background:#f2f6fa}.lessonbody h2{font-size:26px}.lessonbody h3{font-size:16px;margin:20px 0 5px}.lessonbody ul{padding-left:22px}.example{background:#edf6f8;border-left:4px solid var(--teal);padding:15px 18px;border-radius:6px;margin:20px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.rule{display:grid;grid-template-columns:40px 1fr;gap:14px}.rule h3{margin:0}.rule p{margin:5px 0}.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}.field label{font-weight:650}.field input,.field textarea,.field select{padding:10px 12px;border:1px solid #c9d7e5;border-radius:8px;color:var(--ink);background:white;width:100%}.option{display:block;padding:12px;border:1px solid var(--line);border-radius:8px;margin:8px 0;cursor:pointer}.option:has(input:checked){border-color:var(--blue);background:#edf5ff}.option input{margin-right:10px}.docrow{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:16px 0}.docrow:last-child{border:0}.docrow p{margin:2px 0}.docrow .btn{flex:none}.hidden{display:none!important}.menu{display:none}.checkitem{display:flex;gap:12px;align-items:start;border-bottom:1px solid var(--line);padding:12px 0}.checkitem input{margin-top:5px;accent-color:var(--teal)}footer{margin:32px 0 0;color:var(--muted);font-size:12px}.qcorrect{color:#087d55;font-weight:700}.qwrong{color:#a43f21;font-weight:700}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}.lessonlayout{grid-template-columns:1fr}.heroart{width:120px}}@media(max-width:720px){.shell{display:block}.side{display:none;position:fixed;width:260px;z-index:4;box-shadow:0 0 0 100vmax #0006}.side.open{display:block}.top{padding:0 16px;height:62px}.menu{display:block;background:none;border:0;font-size:24px;color:var(--ink)}.search{width:65%}.content{padding:20px 16px 45px}.hero{padding:25px}.heroart{display:none}.grid,.twocol{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.docrow{align-items:start;flex-wrap:wrap}.card{padding:18px}.pagehead h1{font-size:27px}}@media print{.side,.top,.actions,.btn,footer{display:none}.shell{display:block}.content{padding:0}.card{break-inside:avoid}}
</style></head><body><div class="shell"><aside class="side" id="side"><div class="brand"><div class="mark" id="brandicon"></div><div><strong>ATV Security</strong><small>LEARNING PORTAL</small></div></div><nav class="nav" id="nav" aria-label="Điều hướng"></nav><div class="sidefoot">Bản mẫu đào tạo · v0.1<br>Không phải hệ thống thi chính thức.</div></aside><main class="main"><header class="top"><button class="menu" id="menu" aria-label="Mở menu">☰</button><div><strong id="crumb">Tổng quan</strong><br><small>Security awareness</small></div><form class="search" id="searchForm"><span aria-hidden="true">⌕</span><input id="search" aria-label="Tìm nội dung" placeholder="Tìm bài học, quy tắc…"></form></header><div class="content" id="app" tabindex="-1"></div></main></div><script>
const paths={shield:'M12 22s8-3 8-11V5l-8-3-8 3v6c0 8 8 11 8 11Z|M9 12l2 2 4-4',home:'M3 10l9-7 9 7v10H3z|M9 20v-7h6v7',book:'M3 4h7a2 2 0 0 1 2 2v15a4 4 0 0 0-4-3H3z|M21 4h-7a2 2 0 0 0-2 2v15a4 4 0 0 1 4-3h5z',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2|M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8|M22 21v-2a4 4 0 0 0-3-4|M16 3a4 4 0 0 1 0 8',code:'M8 6l-6 6 6 6|M16 6l6 6-6 6|M14 3l-4 18',check:'M9 11l3 3L22 4|M20 12v8H4V4h12',alert:'M12 3 2 20h20L12 3Z|M12 9v4|M12 17h.01',folder:'M3 5h7l2 3h9v12H3z',clipboard:'M8 5H4v17h16V5h-4|M8 2h8v6H8z|M8 12h8|M8 16h8',lock:'M5 11h14v10H5z|M8 11V7a4 4 0 0 1 8 0v4|M12 15v2'};const ic=n=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${(paths[n]||paths.shield).split('|').map(d=>`<path d="${d}"/>`).join('')}</svg>`;document.querySelector('#brandicon').innerHTML=ic('shield');
const rules=[['Giữ bí mật thông tin','Chỉ truy cập tài liệu theo nhiệm vụ. Không chia sẻ mã nguồn, hợp đồng hoặc thiết kế ngoài phạm vi được phép.'],['Bảo vệ tài khoản','Dùng tài khoản riêng, mật khẩu duy nhất và MFA; không tiết lộ OTP hoặc chấp nhận thông báo đăng nhập lạ.'],['Bảo vệ thiết bị','Khóa màn hình, cập nhật thiết bị, không cài phần mềm hoặc kết nối USB không rõ nguồn.'],['Kiểm tra email và tệp','Xác minh người gửi, người nhận, đường dẫn và quyền chia sẻ trước khi thao tác.'],['Dữ liệu đúng mục đích','Chỉ sử dụng dữ liệu cần thiết trong kho và thiết bị được phép; xử lý bản sao theo yêu cầu lưu giữ.'],['Dùng AI an toàn','Không đưa dữ liệu nhạy cảm vào dịch vụ AI khi chưa được phép; kiểm tra kết quả trước khi dùng.'],['Bảo mật nơi làm việc','Bảo quản thẻ, laptop, bản in; tránh để người ngoài nhìn thấy nội dung mật.'],['Đào tạo và báo cáo','Học khóa phù hợp, thực hiện xác nhận theo hướng dẫn và báo ngay dấu hiệu bất thường.']];
const courses={general:{name:'Đào tạo ATTT định kỳ',en:'GENERAL SECURITY',audience:'Mọi nhân viên',icon:'shield',color:'',desc:'Nhận biết rủi ro trong công việc hằng ngày, từ email đến chia sẻ dữ liệu.',lessons:[['Nền tảng ATTT và phân loại dữ liệu','CIA: bí mật, toàn vẹn, sẵn sàng. Mất bí mật là người không có quyền đọc được dữ liệu; mất toàn vẹn là dữ liệu bị thay đổi trái phép; mất sẵn sàng là không truy cập được khi cần.','Phân loại tài liệu trước khi chia sẻ; chưa rõ mức độ thì hạn chế truy cập và hỏi chủ sở hữu.','Một bảng thiết kế vô tình được chia sẻ toàn công ty: thu hẹp quyền và báo người phụ trách.'],['Mật khẩu, MFA và tài khoản','Mỗi người dùng tài khoản riêng. Dùng mật khẩu khác nhau giữa các hệ thống, quản lý mật khẩu được phép và bật MFA.','Không gửi OTP hoặc mã khôi phục; từ chối yêu cầu MFA ngoài dự kiến và báo IT.','Điện thoại hiện yêu cầu xác thực khi bạn không đăng nhập: từ chối, không bấm chấp thuận cho hết thông báo.'],['Email giả mạo và chia sẻ file','Phishing giả danh người đáng tin để lấy thông tin hoặc thúc đẩy thao tác nguy hiểm. Kiểm tra địa chỉ thực, đích link và dấu hiệu thúc giục.','Xác minh yêu cầu bất thường bằng kênh độc lập. Chia sẻ file cho đúng tài khoản, đúng mức quyền, đúng hệ thống.','Email giả danh quản lý đòi danh sách lương: không gửi; xác minh qua kênh đã biết, báo IT.'],['Thiết bị và làm việc từ xa','Khóa màn hình, cập nhật hệ điều hành và không tắt công cụ bảo vệ. Không dùng USB lạ hoặc máy công cộng cho tài liệu công việc.','Dùng thiết bị và kết nối được duyệt; tránh màn hình, cuộc gọi và bản in bị người ngoài nhìn thấy.','Laptop có dấu hiệu mã hóa file: dừng thao tác, ngắt mạng khi an toàn và liên hệ IT.'],['Dữ liệu cá nhân và AI','Chỉ xử lý dữ liệu cá nhân cần thiết, giới hạn quyền và dùng đúng mục đích. AI không phải kho dữ liệu được phép mặc định.','Không đưa bản vẽ, log, token, mã nguồn hay dữ liệu cá nhân vào công cụ chưa được duyệt. Dùng ví dụ giả lập.','Cần dịch bản vẽ mật: kiểm tra quyền sử dụng công cụ dịch trước; không tải bản gốc lên dịch vụ công khai.'],['Ứng phó sự cố và ôn tập','Báo ngay khi nghi gửi nhầm, mất máy, lừa đảo hoặc truy cập lạ; không cần chờ xác nhận thiệt hại.','Dừng hành động nguy hiểm, bảo toàn chứng cứ, báo kênh đã duyệt và cung cấp sự kiện quan sát được.','Gửi nhầm file: thu hồi quyền nếu có thể, ghi thời gian, người nhận, nội dung bị ảnh hưởng và báo.']]},onboard:{name:'Đào tạo nhân viên mới',en:'ONBOARDING SECURITY',audience:'Nhân viên mới',icon:'users',color:'green',desc:'Những bước cần thực hiện trước khi tiếp cận tài khoản và dữ liệu dự án.',lessons:[['NDA và trách nhiệm ngày đầu','NDA là cam kết không tiết lộ thông tin thuộc phạm vi bảo mật. Đọc quy định và hỏi đầu mối khi chưa hiểu yêu cầu.','Không dùng tài liệu dự án cũ để làm dự án khác, kể cả khi đã bỏ tên khách hàng.','Đồng nghiệp đề nghị dùng bản thiết kế của dự án cũ làm mẫu: hỏi chủ sở hữu và quản lý trước.'],['Tài khoản và thiết bị','Thiết lập tài khoản công việc, MFA, thiết bị được phép và công cụ bảo vệ theo hướng dẫn IT.','Không mượn tài khoản hoặc dùng máy cá nhân nếu chưa được cho phép.','Chưa có quyền vào repository: gửi yêu cầu cấp quyền cá nhân, không dùng phiên đăng nhập của đồng nghiệp.'],['Email, tài liệu và AI','Nhận diện file mật, xác minh người gửi và giới hạn quyền chia sẻ. Chỉ dùng dữ liệu cần thiết cho nhiệm vụ.','Công cụ dịch và trợ lý lập trình cũng cần kiểm tra quyền sử dụng dữ liệu.','Một email yêu cầu đăng nhập gấp qua link lạ: không mở, xác minh bằng kênh chính thức.'],['Điều kiện tiếp cận dự án','Xác định vai trò, phạm vi công việc, yêu cầu khách hàng và danh sách quyền cần thiết.','Hoàn thành các yêu cầu đào tạo và xác nhận; chỉ nhận quyền khi được phê duyệt hợp lệ.','Được yêu cầu bắt đầu dự án ngay nhưng hồ sơ chưa đủ: báo quản lý, chờ xác nhận hoặc ngoại lệ hợp lệ.'],['Báo sự cố và hoàn thành','Dừng thao tác nguy hiểm, báo người phụ trách, giữ thông tin sự kiện.','Thực hiện bài kiểm tra được giao và xác nhận theo quy trình chính thức; lưu hồ sơ đúng kênh.','Bấm nhầm đường dẫn giả: không tiếp tục nhập dữ liệu; báo IT ngay.']]},technical:{name:'Đào tạo ATTT kỹ thuật',en:'TECHNICAL SECURITY',audience:'Dev · QA · IT',icon:'code',color:'purple',desc:'Tích hợp kiểm soát bảo mật vào thiết kế, lập trình, kiểm thử và vận hành.',lessons:[['Secure SDLC và threat modeling','Đưa yêu cầu bảo mật vào thiết kế, triển khai, kiểm thử, phát hành và vận hành. Nhận diện tài sản, luồng dữ liệu, ranh giới tin cậy và mối đe dọa.','Gắn kiểm soát và tiêu chí kiểm thử vào từng rủi ro; tham khảo NIST SSDF và OWASP.','Ứng dụng có API tải tài liệu: đánh giá rủi ro truy cập chéo người dùng và kiểm thử trước phát hành.'],['Xác thực, phân quyền và phiên','Xác thực trả lời ai đang truy cập; phân quyền trả lời được truy cập gì. Kiểm tra quyền tại máy chủ, cả đối tượng và tenant.','Giới hạn phiên, bảo vệ cookie, không dựa vào việc ẩn nút trên giao diện.','User A thay ID hồ sơ và đọc được hồ sơ B: kiểm tra quyền truy cập đối tượng phía máy chủ.'],['Input, API và upload','Dữ liệu từ người dùng là không tin cậy. Dùng truy vấn tham số, kiểm tra kiểu/phạm vi, mã hóa đầu ra phù hợp và cơ chế chống CSRF khi cần.','Hạn chế file upload, kiểm tra quyền, giới hạn tài nguyên, không cho phép truy cập tùy ý dịch vụ nội bộ.','Endpoint tải tài liệu phải kiểm tra đối tượng, quyền, giới hạn kích thước và xử lý lỗi an toàn.'],['Secrets, Git và dữ liệu','Không lưu khóa bí mật trong mã nguồn hoặc log. Quản lý secret trong kho được duyệt, áp dụng quyền tối thiểu và xoay vòng khi cần.','Tách môi trường; dùng dữ liệu giả lập cho kiểm thử; bảo vệ dữ liệu truyền tải và lưu trữ.','API key đã commit: phối hợp thu hồi hoặc xoay vòng ngay, báo cáo và xử lý lịch sử theo quy trình.'],['Thư viện, chuỗi cung ứng và cloud','Kiểm tra nguồn, phiên bản, lỗ hổng của thư viện; khóa phiên bản và rà soát thay đổi.','Giới hạn quyền cloud, kiểm tra cấu hình kho lưu trữ và cập nhật theo rủi ro.','Bucket chứa dữ liệu công việc bị đặt công khai: hạn chế quyền và đánh giá phạm vi truy cập.'],['CI/CD, kiểm thử và phát hành','Bảo vệ pipeline và tài khoản deploy, kiểm tra PR, quét dependency và kiểm thử bảo mật theo rủi ro.','Chỉ phát hành khi đáp ứng điều kiện duyệt, có phương án quay lui; không bỏ qua lỗi nghiêm trọng ngoài ngoại lệ hợp lệ.','Một bản build có thư viện nguy hiểm: đánh giá, sửa hoặc xin ngoại lệ hợp lệ trước phát hành.'],['Log, backup và ứng phó','Log đủ để truy vết nhưng không chứa mật khẩu, token hoặc dữ liệu không cần thiết. Giới hạn quyền đọc log.','Thử khôi phục bản sao lưu; khi có sự cố bảo toàn chứng cứ và phối hợp xử lý.','Nghi token xuất hiện trong log: giới hạn truy cập, báo đội ứng cứu và phối hợp thu hồi token.'],['AI lập trình và yêu cầu khách hàng','Chỉ dùng trợ lý AI theo phạm vi được duyệt. Kiểm tra mã sinh ra về chất lượng, lỗ hổng, bản quyền và yêu cầu bảo mật.','Xác nhận công cụ, dữ liệu, quyền chia sẻ và quy trình phát hành của từng dự án.','Muốn đưa mã nguồn thật vào AI để sửa bug: tạo ví dụ độc lập hoặc dùng môi trường đã được cho phép.']]}};
const navs=[['BẮT ĐẦU',[['home','Tổng quan','home'],['rules','Quy tắc ATTT','shield']]],['HỌC TẬP',[['general','Đào tạo định kỳ','book'],['onboard','Nhân viên mới','users'],['technical','Đào tạo kỹ thuật','code'],['quiz','Ôn tập kiến thức','check']]],['HỖ TRỢ',[['incident','Báo cáo sự cố','alert'],['library','Thư viện tài liệu','folder'],['admin','HR / Security','clipboard']]]];
const app=document.querySelector('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let done={};try{done=JSON.parse(localStorage.getItem('atv-study-v1')||'{}')||{}}catch{};let catalog=[];let current='home';let lesson=0;const save=()=>{try{localStorage.setItem('atv-study-v1',JSON.stringify(done))}catch{}};const count=k=>courses[k].lessons.filter((_,i)=>done[k+':'+i]).length;const head=(label,title,desc)=>`<div class="pagehead"><div class="eyebrow">${label}</div><h1>${title}</h1><p class="sub">${desc}</p></div>`;const action=(key,label,cl='')=>`<button class="btn ${cl}" data-go="${key}">${label}</button>`;const courseCard=(k,c)=>`<article class="card tile"><div class="symbol ${c.color}">${ic(c.icon)}</div><div class="tag" style="margin-top:12px">${c.en}</div><h3>${c.name}</h3><p>${c.desc}</p><div class="small">${c.audience} · ${c.lessons.length} bài</div><div class="progress"><span style="width:${count(k)/c.lessons.length*100}%"></span></div><p class="small">${count(k)}/${c.lessons.length} bài đã đánh dấu</p>${action(k,'Vào khóa học →','alt')}</article>`;
function home(){return `<section class="hero"><div><div class="eyebrow">ATV / Security awareness</div><h1>Bảo mật bắt đầu<br>từ mỗi chúng ta.</h1><p>Học đúng nội dung theo vai trò, nhận diện rủi ro thực tế và biết cách xử lý an toàn khi có sự cố.</p>${action('rules','Bắt đầu với 8 quy tắc →')}</div><svg class="heroart" viewBox="0 0 180 180" fill="none" aria-hidden="true"><circle cx="90" cy="90" r="80" stroke="currentColor" opacity=".2"/><circle cx="90" cy="90" r="66" stroke="currentColor" opacity=".35" stroke-dasharray="4 8"/><path d="M90 29 139 48v39c0 36-22 52-49 66-27-14-49-30-49-66V48z" stroke="currentColor" stroke-width="3" fill="#ffffff10"/><rect x="67" y="79" width="46" height="36" rx="8" stroke="currentColor" stroke-width="3"/><path d="M76 79V69a14 14 0 0 1 28 0v10M90 92v10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></section><div class="sectionhead"><div><h2>Lộ trình học tập</h2><p class="sub">Chọn khóa phù hợp với công việc của bạn.</p></div></div><div class="grid">${Object.entries(courses).map(([k,c])=>courseCard(k,c)).join('')}</div><div class="sectionhead"><h2>4 bước thực hiện</h2></div><div class="steps">${[['Đọc quy tắc','Nắm nguyên tắc cơ bản'],['Học theo vai trò','Đọc bài học và tình huống'],['Ôn tập','Luyện trắc nghiệm minh họa'],['Xác nhận','Thực hiện trên hệ thống được duyệt']].map((s,i)=>`<div class="step"><span class="num">${i+1}</span><div><strong>${s[0]}</strong><small>${s[1]}</small></div></div>`).join('')}</div><div class="sectionhead"><h2>Khi nghi ngờ có sự cố</h2></div><div class="card"><div class="rule"><div class="symbol green">${ic('alert')}</div><div><h3>Dừng · Báo · Bảo toàn bằng chứng</h3><p>Không cần chờ có thiệt hại mới báo cáo. Sử dụng đầu mối chính thức của đơn vị.</p>${action('incident','Mẫu báo cáo nhanh','alt')}</div></div></div><div class="notice">Đây là bản học liệu tóm tắt để rà soát trước khi công bố. Nội dung chính thức và các yêu cầu nội bộ phải được đối chiếu với tài liệu đã duyệt.</div>`}
function rulePage(){return head('Hướng dẫn','8 quy tắc an toàn thông tin','Bảo vệ dữ liệu, tài khoản và thiết bị trong công việc.')+`<div class="twocol">${rules.map((r,i)=>`<article class="card rule"><span class="num">${i+1}</span><div><h3>${r[0]}</h3><p>${r[1]}</p></div></article>`).join('')}</div><div class="sectionhead"><h2>Phân loại thông tin</h2></div><div class="twocol">${[['Public','Chỉ công bố nội dung được phép.'],['Internal','Chia sẻ nội bộ theo nhu cầu công việc.'],['Confidential','Giới hạn quyền với mã nguồn, thiết kế, hợp đồng và dữ liệu cá nhân.'],['Restricted','Bảo vệ đặc biệt mật khẩu, secret và dữ liệu nhạy cảm cao.']].map(r=>`<div class="card"><div class="tag">${r[0]}</div><p>${r[1]}</p></div>`).join('')}</div>`}
function coursePage(k){const c=courses[k],l=c.lessons[lesson];return head(c.en,c.name,c.desc)+`<div class="lessonlayout"><aside class="card lessonnav"><div class="tag">${count(k)}/${c.lessons.length} bài đã đánh dấu</div><div class="progress"><span style="width:${count(k)/c.lessons.length*100}%"></span></div>${c.lessons.map((x,i)=>`<button data-lesson="${i}" class="${i===lesson?'current':''}">${done[k+':'+i]?'✓':'○'} ${i+1}. ${x[0]}</button>`).join('')}</aside><article class="card lessonbody"><div class="eyebrow">BÀI ${lesson+1} / ${c.lessons.length}</div><h2 style="margin-top:8px">${l[0]}</h2><h3>Hiểu đúng</h3><p>${l[1]}</p><h3>Cần làm gì?</h3><p>${l[2]}</p><div class="example"><strong>Tình huống thực tế</strong><p style="margin:6px 0 0">${l[3]}</p></div><div class="actions"><button class="btn alt" id="prev" ${lesson===0?'disabled':''}>← Bài trước</button><button class="btn" id="complete">${done[k+':'+lesson]?'Đã đánh dấu · Tiếp tục':'Đánh dấu đã học →'}</button></div><p class="small">Tiến độ chỉ lưu trên trình duyệt này, không phải bằng chứng hoàn thành đào tạo.</p></article></div>`}
const questions={general:[['Nhận yêu cầu MFA khi không đăng nhập. Bạn làm gì?',['Chấp thuận cho hết thông báo','Từ chối và báo IT','Gửi mã OTP cho đồng nghiệp'],1,'Thông báo MFA bất ngờ có thể là dấu hiệu tài khoản bị tấn công.'],['Tài liệu chưa rõ mức độ bảo mật nên được xử lý thế nào?',['Công khai để mọi người phân loại','Gửi qua email cá nhân','Giới hạn quyền và hỏi chủ sở hữu'],2,'Khi chưa rõ, ưu tiên hạn chế truy cập.'],['Email từ người tự xưng là quản lý yêu cầu gửi tài liệu gấp.',['Xác minh bằng kênh đã biết','Gửi ngay để không trễ','Chỉ kiểm tra tên hiển thị'],0,'Xác minh độc lập giúp phát hiện mạo danh.'],['Khi thấy dấu hiệu lộ dữ liệu nhưng chưa chắc chắn?',['Chờ có thiệt hại','Báo ngay dấu hiệu quan sát được','Xóa chứng cứ'],1,'Báo cáo sớm hỗ trợ xử lý.'],['Cần dùng AI để xử lý tài liệu mật.',['Dùng công cụ công khai','Chỉ đổi tên tệp','Xác nhận công cụ và dữ liệu được phép'],2,'Công cụ AI cần được phê duyệt theo phạm vi dữ liệu.']],onboard:[['Chưa được cấp quyền dự án, cần xem repository.',['Mượn tài khoản','Xin cấp quyền cá nhân đúng quy trình','Dùng tài khoản chung'],1,'Quyền cá nhân hỗ trợ kiểm soát và truy vết.'],['NDA dùng để làm gì?',['Cam kết bảo vệ thông tin thuộc phạm vi bảo mật','Thay thế MFA','Cấp quyền truy cập mọi tài liệu'],0,'NDA không thay thế các kiểm soát bảo mật khác.'],['Laptop ngày đầu cần gì?',['Tắt công cụ bảo vệ','Cài ứng dụng tùy ý','Kiểm tra cập nhật, MFA và cấu hình được phép'],2,'Thiết bị và tài khoản phải đáp ứng yêu cầu được duyệt.'],['Quyền dự án chưa được xác nhận đầy đủ.',['Tiếp tục truy cập','Báo đầu mối và chờ duyệt','Mượn quyền người khác'],1,'Không vượt qua bước phê duyệt.'],['Bấm nhầm link đáng ngờ.',['Dừng và báo IT','Nhập thông tin để kiểm tra','Xóa lịch sử rồi bỏ qua'],0,'Báo ngay để đội ứng cứu hỗ trợ.']],technical:[['API kiểm tra đăng nhập nhưng không kiểm tra chủ sở hữu dữ liệu.',['Ẩn nút trên UI là đủ','Kiểm tra quyền đối tượng ở máy chủ','Chỉ thêm CAPTCHA'],1,'Phân quyền phải được kiểm tra phía máy chủ.'],['Một khóa API đã xuất hiện trong Git.',['Chỉ xóa dòng code','Đổi tên biến','Phối hợp thu hồi hoặc xoay vòng khóa và báo cáo'],2,'Xóa code không vô hiệu hóa khóa đã lộ.'],['Kiểm thử cần dữ liệu đại diện.',['Ưu tiên dữ liệu giả lập','Sao chép toàn bộ production','Chia sẻ log thật công khai'],0,'Dữ liệu giả lập giảm rủi ro lộ dữ liệu.'],['Biện pháp giảm SQL injection?',['Ẩn lỗi phía giao diện','Dùng truy vấn có tham số','Chỉ mã hóa đường dẫn'],1,'Truy vấn tham số tách dữ liệu khỏi cú pháp.'],['Có bản sao lưu nhưng chưa thử khôi phục.',['Đã đủ','Xóa backup để tiết kiệm','Thử phục hồi có kiểm soát'],2,'Khả năng phục hồi cần được xác minh.']]};let quizKey='general';let quizSet=[];function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function startQuiz(k){quizKey=k;quizSet=shuffle(questions[k]).map(q=>({q:q[0],a:shuffle(q[1].map((x,i)=>({x,ok:i===q[2]}))),ex:q[3]}));render('quiz',false)}function quizPage(){if(!quizSet.length)quizSet=shuffle(questions[quizKey]).map(q=>({q:q[0],a:shuffle(q[1].map((x,i)=>({x,ok:i===q[2]}))),ex:q[3]}));return head('Tự kiểm tra','Ôn tập kiến thức','Các câu hỏi minh họa do website biên soạn. Không dùng để ghi nhận kết quả đào tạo chính thức.')+`<div class="card"><label for="quizCourse"><strong>Chọn khóa</strong></label><div class="field"><select id="quizCourse">${Object.entries(courses).map(([k,c])=>`<option value="${k}" ${k===quizKey?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="small">${quizSet.length} câu · chọn 1 phương án · đảo thứ tự câu và đáp án</div></div><form id="quizForm">${quizSet.map((q,i)=>`<article class="card" style="margin-top:12px"><div class="tag">Câu ${i+1}</div><h3>${q.q}</h3>${q.a.map((a,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" required>${a.x}</label>`).join('')}<div id="feedback${i}" aria-live="polite"></div></article>`).join('')}<div class="actions"><button class="btn" type="submit">Chấm điểm</button><button class="btn alt" type="button" id="retry">Tạo lượt ôn mới</button></div><div id="result" aria-live="polite"></div></form>`}
function incidentPage(){return head('Ứng phó sự cố','Báo cáo sự cố ATTT','Dừng hành động nguy hiểm, liên hệ đầu mối chính thức và bảo toàn bằng chứng.')+`<div class="steps" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">${[['Dừng','Ngừng thao tác, cô lập kết nối nếu an toàn.'],['Báo ngay','Liên hệ Security / IT hoặc quản lý.'],['Ghi nhận','Ghi thông tin thực tế, bảo vệ chứng cứ.']].map((s,i)=>`<div class="step"><span class="num">${i+1}</span><div><strong>${s[0]}</strong><small>${s[1]}</small></div></div>`).join('')}</div><div class="notice">Chỉ tạo bản nháp tại trình duyệt, không tự động gửi hoặc lưu nội dung. Không nhập mật khẩu, OTP, token, dữ liệu cá nhân hoặc nội dung tài liệu mật. Dùng kênh được phê duyệt; không tự thông báo khách hàng.</div><div class="card"><h2>Mẫu báo cáo nhanh</h2><form id="reportForm"><div class="twocol">${[['time','Thời điểm phát hiện','datetime-local'],['who','Người báo / đầu mối liên hệ','text'],['system','Hệ thống / dự án (mã tham chiếu)','text'],['kind','Dấu hiệu sự cố','text']].map(([k,t,type])=>`<div class="field"><label for="r${k}">${t}</label><input id="r${k}" name="${k}" type="${type}" required></div>`).join('')}</div>${[['description','Mô tả sự việc'],['impact','Phạm vi nghi bị ảnh hưởng'],['actions','Hành động đã thực hiện'],['evidence','Mã tham chiếu chứng cứ (không dán nội dung mật)']].map(([k,t])=>`<div class="field"><label for="r${k}">${t}</label><textarea id="r${k}" name="${k}" rows="2"></textarea></div>`).join('')}<button class="btn" type="submit">Tạo nội dung báo cáo</button></form><div id="reportOutput" class="hidden"><div class="field"><label for="reportText">Nội dung để gửi qua kênh được duyệt</label><textarea id="reportText" rows="11" readonly></textarea></div><button class="btn alt" id="copyReport">Sao chép</button><p class="small" id="copyStatus" role="status"></p></div></div>`}
const categories=[['Hướng dẫn bắt đầu','Lộ trình và danh mục tài liệu'],['Quy định và hướng dẫn','Quy tắc và quy trình đào tạo'],['Tài liệu đào tạo','General, Onboarding, Technical'],['Kiểm tra kiến thức','Nguồn câu hỏi chính thức – hạn chế'],['Hồ sơ đào tạo và nhân sự','Hồ sơ, NDA, checklist – hạn chế'],['Báo cáo khách hàng','Mẫu và chứng cứ – hạn chế']];function libraryPage(){return head('Tài liệu','Thư viện tài liệu','Tài liệu gốc được quản lý và phân quyền trên Google Drive.')+`<div class="notice">Bản công khai không chứa liên kết Drive nội bộ. Nếu được cấp quyền, dùng tệp danh mục riêng do quản trị viên cung cấp. Tệp chỉ được đọc trong phiên trình duyệt; không tải lên máy chủ.</div><div class="card"><h2>Danh mục tài liệu</h2><div class="field"><label for="catalogFile">Nạp danh mục Drive (.json)</label><input type="file" id="catalogFile" accept="application/json,.json"></div><div class="actions"><button id="clearCatalog" class="btn alt">Xóa danh mục khỏi phiên</button></div><div id="catalogStatus" class="small" role="status">${catalog.length?`Đã nạp ${catalog.length} mục.`:'Chưa nạp danh mục.'}</div><div id="catalogList">${catalog.length?catalog.map(d=>`<div class="docrow"><div><div class="tag">${esc(d.group)}</div><strong>${esc(d.title)}</strong><p class="small">${esc(d.access)}</p></div><a class="btn alt" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">Mở Drive ↗</a></div>`).join(''):categories.map(d=>`<div class="docrow"><div><strong>${d[0]}</strong><p class="small">${d[1]}</p></div>${ic('lock')}</div>`).join('')}</div></div>`}
function adminPage(){return head('Vận hành','HR / Security','Checklist tham khảo cho người tổ chức. Không lưu thông tin nhân sự trên website công khai.')+`<div class="card"><h2>Quy trình tổ chức đào tạo</h2>${[['Chuẩn bị','Xác định đối tượng, lịch, phiên bản tài liệu, phạm vi và điều kiện đạt đã được duyệt.'],['Học và kiểm tra','Ghi nhận ngày học thực tế và bằng chứng tham gia; dùng hệ thống kiểm tra được phê duyệt.'],['Chốt hồ sơ','Đối chiếu danh tính, lượt thi, điểm, xác nhận và bằng chứng. Giữ lịch sử thi lại; xử lý trường hợp chưa đạt.'],['Báo cáo','Chỉ dùng dữ liệu đã xác minh, mẫu khách hàng được duyệt và phạm vi thông tin cần thiết.']].map((s,i)=>`<div class="docrow"><div class="rule"><span class="num">${i+1}</span><div><strong>${s[0]}</strong><p>${s[1]}</p></div></div></div>`).join('')}</div><div class="sectionhead"><h2>Checklist trước khi cấp quyền dự án</h2></div><div class="card" id="checks">${['NDA đã ký theo quy định','Đã đọc quy định ATTT hiện hành','Đã xác nhận phạm vi công việc và yêu cầu dự án','Hoàn thành học, thi và xác nhận theo quy trình','Tài khoản riêng, MFA và thiết bị được duyệt','Danh sách quyền được xác nhận','Chưa cấp quyền dự án trước xác nhận hoặc ngoại lệ hợp lệ'].map(t=>`<label class="checkitem"><input type="checkbox">${t}</label>`).join('')}<p id="checkCount" class="small" aria-live="polite">0/7 mục được đánh dấu.</p><div class="notice">Các dấu kiểm chỉ hỗ trợ rà soát, không thay thế hồ sơ, chứng cứ và xác nhận chính thức của Security.</div>${action('library','Mở thư viện tài liệu','alt')}</div>`}
const normalize=s=>String(s).normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase().replace(/đ/g,'d');function searchPage(query){const results=[];const q=normalize(query.trim());if(q){rules.forEach((r,i)=>{if(normalize(r.join(' ')).includes(q))results.push(['rules',null,r[0],r[1]])});Object.entries(courses).forEach(([k,c])=>c.lessons.forEach((l,i)=>{if(normalize([c.name,...l].join(' ')).includes(q))results.push([k,i,l[0],c.name])}));}return head('Tìm kiếm',`Kết quả cho “${esc(query)}”`,`${results.length} kết quả trong quy tắc và bài học.`)+`<div class="card">${results.length?results.map(r=>`<div class="docrow"><div><strong>${esc(r[2])}</strong><p>${esc(r[3])}</p></div><button class="btn alt" data-go="${r[0]}" ${r[1]!==null?`data-target-lesson="${r[1]}"`:''}>Mở →</button></div>`).join(''):'Không tìm thấy nội dung. Thử từ khóa khác.'}</div>`}
let searchQuery='';function render(key,top=true){current=key;document.querySelector('#nav').innerHTML=navs.map(([g,items])=>`<div class="navlabel">${g}</div>${items.map(([k,t,n])=>`<button data-go="${k}" class="${key===k?'active':''}" ${key===k?'aria-current="page"':''}>${ic(n)}${t}</button>`).join('')}`).join('');document.querySelector('#crumb').textContent=navs.flatMap(n=>n[1]).find(n=>n[0]===key)?.[1]||'Tìm kiếm';app.innerHTML=(key==='home'?home():key==='rules'?rulePage():courses[key]?coursePage(key):key==='quiz'?quizPage():key==='incident'?incidentPage():key==='library'?libraryPage():key==='admin'?adminPage():searchPage(searchQuery))+`<footer>ATV Security Portal · Bản mẫu v0.1 · Nội dung cần được phê duyệt trước sử dụng chính thức.</footer>`;document.querySelector('#side').classList.remove('open');if(top)window.scrollTo(0,0);bind()}
function go(k,i){if(courses[k])lesson=Number.isInteger(i)&&i>=0&&i<courses[k].lessons.length?i:Math.max(0,courses[k].lessons.findIndex((_,j)=>!done[k+':'+j]));if(location.hash==='#'+k)render(k);else{location.hash=k;render(k)}}window.addEventListener('hashchange',()=>{let k=location.hash.slice(1);if(k!==current){if(courses[k])lesson=0;render(navs.flatMap(n=>n[1]).some(n=>n[0]===k)?k:'home')}});document.addEventListener('click',e=>{const el=e.target.closest('[data-go]');if(el)go(el.dataset.go,el.hasAttribute('data-target-lesson')?Number(el.dataset.targetLesson):undefined);const item=e.target.closest('[data-lesson]');if(item){lesson=Number(item.dataset.lesson);render(current,false)}});document.querySelector('#menu').onclick=()=>document.querySelector('#side').classList.toggle('open');document.querySelector('#searchForm').onsubmit=e=>{e.preventDefault();searchQuery=document.querySelector('#search').value;render('search')};
function bind(){const $=id=>document.getElementById(id);if(courses[current]){$('prev').onclick=()=>{if(lesson>0){lesson--;render(current,false)}};$('complete').onclick=()=>{done[current+':'+lesson]=true;save();if(lesson<courses[current].lessons.length-1){lesson++;render(current,false)}else{startQuiz(current);location.hash='quiz'}}}if(current==='quiz'){$('quizCourse').onchange=e=>startQuiz(e.target.value);$('retry').onclick=()=>startQuiz(quizKey);$('quizForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);let points=0;quizSet.forEach((q,i)=>{const a=q.a[Number(f.get('q'+i))];if(a.ok)points++;$('feedback'+i).innerHTML=`<p class="${a.ok?'qcorrect':'qwrong'}">${a.ok?'Đúng':'Chưa đúng'}</p><p>${q.ex}</p>`});$('result').innerHTML=`<div class="card" style="margin-top:16px"><h2>Kết quả ôn tập: ${points}/${quizSet.length} (${Math.round(points/quizSet.length*100)}%)</h2><p>Không phải điểm thi chính thức. Xem giải thích và học lại nội dung chưa rõ.</p></div>`;$('result').scrollIntoView({block:'nearest'});e.currentTarget.querySelectorAll('input').forEach(x=>x.disabled=true);e.currentTarget.querySelector('[type=submit]').disabled=true}}if(current==='incident'){$('reportForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget);$('reportText').value='[SECURITY INCIDENT] – '+f.get('kind')+'\n'+[['Thời điểm','time'],['Người báo','who'],['Hệ thống / dự án','system'],['Mô tả','description'],['Phạm vi nghi bị ảnh hưởng','impact'],['Hành động đã làm','actions'],['Tham chiếu chứng cứ','evidence']].map(([t,k])=>t+': '+f.get(k)).join('\n');$('reportOutput').classList.remove('hidden')};$('copyReport').onclick=async()=>{try{await navigator.clipboard.writeText($('reportText').value);$('copyStatus').textContent='Đã sao chép.'}catch{$('reportText').select();$('copyStatus').textContent='Hãy sao chép nội dung đã chọn.'}}}if(current==='library'){$('clearCatalog').onclick=()=>{catalog=[];render('library',false)};$('catalogFile').onchange=async e=>{try{const file=e.target.files[0];if(!file||file.size>1000000)throw Error('Tệp không hợp lệ hoặc quá lớn.');const d=JSON.parse(await file.text());if(!Array.isArray(d)||d.length>200)throw Error('Danh mục không đúng định dạng.');catalog=d.map(x=>{const u=new URL(x.url);if(u.protocol!=='https:'||!['drive.google.com','docs.google.com'].includes(u.hostname))throw Error('Chỉ chấp nhận liên kết HTTPS Google Drive/Docs.');return {title:String(x.title||''),group:String(x.group||''),access:String(x.access||''),url:u.href}});render('library',false)}catch(err){$('catalogStatus').textContent='Không nạp được: '+err.message}}}if(current==='admin')$('checks').onchange=()=>{$('checkCount').textContent=$('checks').querySelectorAll('input:checked').length+'/7 mục được đánh dấu.'}}
const initial=location.hash.slice(1);render(navs.flatMap(n=>n[1]).some(n=>n[0]===initial)?initial:'home');
</script></body></html>
